<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Tip Tracker"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Tip Out Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@300;400&display=swap');

  :root {
    --gold: #c8a96e;
    --gold-dim: rgba(200,169,110,0.15);
    --gold-border: rgba(200,169,110,0.3);
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1c1c1c;
    --border: #262626;
    --text: #f0e6d3;
    --text-dim: #888;
    --text-faint: #444;
    --red: #c0392b;
    --green: #2ecc71;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    font-family: 'DM Mono', monospace;
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topbar-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 0.02em;
  }
  .sync-status {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 4px 8px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--text-faint);
  }
  .sync-status.synced  { color: var(--green); border-color: rgba(46,204,113,0.3); background: rgba(46,204,113,0.07); }
  .sync-status.syncing { color: var(--gold);  border-color: var(--gold-border);   background: var(--gold-dim); }
  .sync-status.error   { color: var(--red);   border-color: rgba(192,57,43,0.3);  background: rgba(192,57,43,0.07); }
  .topbar-date {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-top: 2px;
    text-transform: uppercase;
  }

  .date-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .date-bar label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); }
  #datePicker {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 6px 10px;
    outline: none;
    flex: 1;
  }
  #datePicker:focus { border-color: var(--gold); }

  .shift-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .shift-tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .shift-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  .content { padding: 20px; max-width: 600px; margin: 0 auto; }

  .category {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .category-header {
    background: var(--gold-dim);
    border-bottom: 1px solid var(--gold-border);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .category-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--gold);
    font-style: italic;
  }
  .category-total {
    font-size: 18px;
    color: var(--gold);
    font-family: 'Playfair Display', serif;
  }

  .slot-list { padding: 8px 0; }
  .slot-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
  }
  .slot-row:last-child { border-bottom: none; }

  .slot-locked-badge {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-faint);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 5px;
    white-space: nowrap;
    flex: 2;
  }
  .slot-name {
    flex: 2;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 13px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    outline: none;
  }
  .slot-name:focus { border-color: var(--gold); }

  .dollar-wrap { position: relative; flex: 1.2; }
  .dollar-sign {
    position: absolute;
    left: 9px; top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 13px;
    pointer-events: none;
  }
  .slot-amount {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 8px 8px 22px;
    font-size: 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    outline: none;
    -webkit-appearance: none;
    -moz-appearance: textfield;
  }
  .slot-amount:focus { border-color: var(--gold); }
  .slot-amount::-webkit-inner-spin-button,
  .slot-amount::-webkit-outer-spin-button { -webkit-appearance: none; }

  .remove-btn {
    background: transparent; border: none;
    color: var(--text-faint); font-size: 18px;
    cursor: pointer; padding: 0 2px;
    line-height: 1; font-family: inherit;
    width: 22px; flex-shrink: 0;
  }
  .remove-btn:active { color: var(--red); }
  .slot-spacer { width: 22px; flex-shrink: 0; }

  .add-server-row { padding: 10px 16px; border-top: 1px solid var(--border); }
  .add-server-btn {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    width: 100%; padding: 8px;
    border-radius: 4px;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    font-family: 'DM Mono', monospace; cursor: pointer; transition: all 0.2s;
  }
  .add-server-btn:active { border-color: var(--gold); color: var(--gold); }

  .save-row { margin-top: 8px; }
  .save-btn {
    width: 100%; background: var(--gold); border: none;
    border-radius: 6px; color: #0a0a0a;
    font-family: 'DM Mono', monospace;
    font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase;
    padding: 14px; cursor: pointer; transition: opacity 0.2s;
  }
  .save-btn:active { opacity: 0.8; }
  .save-btn:disabled { opacity: 0.5; cursor: default; }

  .section-title {
    font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--text-dim); margin: 28px 0 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .history-empty {
    text-align: center; color: var(--text-faint);
    font-size: 12px; padding: 24px; letter-spacing: 0.1em;
  }

  .history-entry {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 12px; overflow: hidden;
  }
  .history-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .history-date-label { font-size: 12px; color: var(--text); letter-spacing: 0.1em; }
  .history-shift-badge {
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 3px; margin-left: 8px;
  }
  .badge-am { background: rgba(200,169,110,0.15); color: var(--gold); }
  .badge-pm { background: rgba(100,120,200,0.15); color: #8899dd; }

  .history-totals { display: flex; }
  .history-cat {
    flex: 1; padding: 10px 14px;
    border-right: 1px solid var(--border);
  }
  .history-cat:last-child { border-right: none; }
  .history-cat-name {
    font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 4px;
  }
  .history-cat-amount {
    font-size: 15px; color: var(--gold);
    font-family: 'Playfair Display', serif; font-style: italic;
  }

  .history-delete {
    display: flex; justify-content: flex-end;
    padding: 8px 14px; border-top: 1px solid var(--border);
  }
  .delete-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-faint); font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; font-family: 'DM Mono', monospace;
    padding: 5px 12px; border-radius: 3px; cursor: pointer;
  }
  .delete-btn:active { border-color: var(--red); color: var(--red); }

  #toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    color: #0a0a0a; font-family: 'DM Mono', monospace;
    font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 12px 24px; border-radius: 6px;
    transition: transform 0.3s ease; z-index: 999; white-space: nowrap;
    background: var(--gold);
  }
  #toast.show  { transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--red); color: #fff; }

  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="topbar-title">Tip Out Tracker</div>
    <div class="sync-status" id="syncStatus">● Connecting…</div>
  </div>
  <div class="topbar-date" id="todayLabel"></div>
</div>

<div class="date-bar">
  <label for="datePicker">Date</label>
  <input type="date" id="datePicker"/>
</div>

<div class="shift-tabs">
  <div class="shift-tab active" data-shift="AM" onclick="switchShift('AM')">☀ AM Shift</div>
  <div class="shift-tab" data-shift="PM" onclick="switchShift('PM')">🌙 PM Shift</div>
</div>

<div class="content">

  <div class="category">
    <div class="category-header">
      <span class="category-title">Bar Tip Out</span>
      <span class="category-total" id="bar-total">$0.00</span>
    </div>
    <div class="slot-list" id="bar-slots"></div>
    <div class="add-server-row">
      <button class="add-server-btn" onclick="addServer('bar')">+ Add Server</button>
    </div>
  </div>

  <div class="category">
    <div class="category-header">
      <span class="category-title">Food Runners Tip Out</span>
      <span class="category-total" id="runner-total">$0.00</span>
    </div>
    <div class="slot-list" id="runner-slots"></div>
    <div class="add-server-row">
      <button class="add-server-btn" onclick="addServer('runner')">+ Add Server</button>
    </div>
  </div>

  <div class="category">
    <div class="category-header">
      <span class="category-title">Busser Tip Out</span>
      <span class="category-total" id="busser-total">$0.00</span>
    </div>
    <div class="slot-list" id="busser-slots"></div>
    <div class="add-server-row">
      <button class="add-server-btn" onclick="addServer('busser')">+ Add Server</button>
    </div>
  </div>

  <div class="save-row">
    <button class="save-btn" id="saveBtn" onclick="saveShift()">☁ Save Shift</button>
  </div>

  <div class="section-title">Saved History</div>
  <div id="history-list"></div>

</div>

<div id="toast"></div>

<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc,
         collection, onSnapshot, query,
         orderBy }                                from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ─── Firebase config ───────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyBo20eNwKSMIVM72A9fCJ21ee1JyQUCurc",
  authDomain:        "tip-out-tracker.firebaseapp.com",
  projectId:         "tip-out-tracker",
  storageBucket:     "tip-out-tracker.firebasestorage.app",
  messagingSenderId: "252492531570",
  appId:             "1:252492531570:web:34312202073824035c3feb"
};

const firebaseApp = initializeApp(firebaseConfig);
const db          = getFirestore(firebaseApp);
const COLLECTION  = "shifts";

// ─── State ─────────────────────────────────────────────────────
let currentShift = 'AM';
let currentDate  = '';
let savedShifts  = {};   // key: "YYYY-MM-DD::AM" etc.
let workingData  = { bar: [], runner: [], busser: [] };
let _uid = 0;
function uid() { return 'u' + Date.now() + '_' + (++_uid); }
function storageKey() { return currentDate + '::' + currentShift; }

// ─── Sync status UI ────────────────────────────────────────────
function setSyncStatus(state, label) {
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status ' + state;
  el.textContent = label;
}

// ─── Default data ──────────────────────────────────────────────
function defaultData() {
  const isPM = currentShift === 'PM';
  return {
    bar:    [{ id: uid(), name: '', amount: '', server: true }],
    runner: [
      { id: uid(), name: 'Host',          amount: '', locked: true },
      { id: uid(), name: 'Bar',           amount: '', locked: true },
      { id: uid(), name: '',              amount: '', server: true },
      ...(isPM ? [{ id: uid(), name: 'Online Takeout', amount: '', locked: true, pmOnly: true }] : [])
    ],
    busser: [{ id: uid(), name: '', amount: '', server: true }]
  };
}

// ─── Init ──────────────────────────────────────────────────────
function init() {
  const today = new Date();
  const yyyy  = today.getFullYear();
  const mm    = String(today.getMonth() + 1).padStart(2, '0');
  const dd    = String(today.getDate()).padStart(2, '0');
  currentDate = `${yyyy}-${mm}-${dd}`;
  document.getElementById('datePicker').value = currentDate;
  document.getElementById('todayLabel').textContent =
    today.toLocaleDateString('en-US',
      { weekday:'long', year:'numeric', month:'long', day:'numeric' }).toUpperCase();

  // Real-time listener — fires on load and on any change from any device
  setSyncStatus('syncing', '● Syncing…');
  const q = query(collection(db, COLLECTION));
  onSnapshot(q,
    (snapshot) => {
      savedShifts = {};
      snapshot.forEach(docSnap => {
        savedShifts[docSnap.id] = docSnap.data();
      });
      setSyncStatus('synced', '● Synced');
      loadWorkingData();
      renderAll();
      renderHistory();
    },
    (err) => {
      console.error('Firestore error:', err);
      setSyncStatus('error', '● Offline');
      showToast('Connection error — check internet', true);
    }
  );
}

// ─── Working data ──────────────────────────────────────────────
function loadWorkingData() {
  const key = storageKey();
  workingData = savedShifts[key]
    ? JSON.parse(JSON.stringify(savedShifts[key]))
    : defaultData();
}

// ─── Shift / date switch ───────────────────────────────────────
window.switchShift = function(shift) {
  currentShift = shift;
  document.querySelectorAll('.shift-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.shift === shift)
  );
  loadWorkingData();
  renderAll();
};

document.getElementById('datePicker').addEventListener('change', function() {
  currentDate = this.value;
  loadWorkingData();
  renderAll();
  renderHistory();
});

// ─── Render ────────────────────────────────────────────────────
function renderAll() { ['bar','runner','busser'].forEach(renderCategory); }

function renderCategory(cat) {
  const list = document.getElementById(`${cat}-slots`);
  list.innerHTML = '';
  workingData[cat].forEach(slot => list.appendChild(makeSlotRow(cat, slot)));
  updateTotal(cat);
}

function makeSlotRow(cat, slot) {
  const row = document.createElement('div');
  row.className = 'slot-row';

  if (slot.locked) {
    const badge = document.createElement('span');
    badge.className = 'slot-locked-badge';
    badge.textContent = slot.name;
    row.appendChild(badge);
  } else {
    const nameInput = document.createElement('input');
    nameInput.className = 'slot-name';
    nameInput.type = 'text';
    nameInput.placeholder = 'Server name';
    nameInput.value = slot.name || '';
    nameInput.addEventListener('input', e => { slot.name = e.target.value; });
    row.appendChild(nameInput);
  }

  const dWrap = document.createElement('div');
  dWrap.className = 'dollar-wrap';
  const dSign = document.createElement('span');
  dSign.className = 'dollar-sign';
  dSign.textContent = '$';
  const amtInput = document.createElement('input');
  amtInput.className = 'slot-amount';
  amtInput.type = 'number';
  amtInput.min = '0'; amtInput.step = '0.01';
  amtInput.placeholder = '0.00'; amtInput.inputMode = 'decimal';
  amtInput.value = slot.amount || '';
  amtInput.addEventListener('input', e => { slot.amount = e.target.value; updateTotal(cat); });
  dWrap.appendChild(dSign);
  dWrap.appendChild(amtInput);
  row.appendChild(dWrap);

  if (!slot.locked) {
    const rmBtn = document.createElement('button');
    rmBtn.className = 'remove-btn';
    rmBtn.textContent = '×';
    rmBtn.addEventListener('click', () => {
      workingData[cat] = workingData[cat].filter(s => s.id !== slot.id);
      renderCategory(cat);
    });
    row.appendChild(rmBtn);
  } else {
    const spacer = document.createElement('span');
    spacer.className = 'slot-spacer';
    row.appendChild(spacer);
  }
  return row;
}

window.addServer = function(cat) {
  const newSlot = { id: uid(), name: '', amount: '', server: true };
  if (cat === 'runner' && currentShift === 'PM') {
    const pmIdx = workingData.runner.findIndex(s => s.pmOnly);
    pmIdx > -1
      ? workingData.runner.splice(pmIdx, 0, newSlot)
      : workingData.runner.push(newSlot);
  } else {
    workingData[cat].push(newSlot);
  }
  renderCategory(cat);
};

function updateTotal(cat) {
  const total = workingData[cat].reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
  document.getElementById(`${cat}-total`).textContent = fmt(total);
}

// ─── Save ──────────────────────────────────────────────────────
window.saveShift = async function() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  setSyncStatus('syncing', '● Saving…');
  try {
    const key  = storageKey();
    const copy = JSON.parse(JSON.stringify(workingData));
    await setDoc(doc(db, COLLECTION, key), copy);
    showToast('Shift Saved & Synced ☁');
  } catch(e) {
    console.error(e);
    setSyncStatus('error', '● Save failed');
    showToast('Save failed — check internet', true);
  } finally {
    btn.disabled = false;
  }
};

// ─── Delete ────────────────────────────────────────────────────
async function deleteShift(key) {
  if (!confirm('Delete this saved shift?')) return;
  try {
    await deleteDoc(doc(db, COLLECTION, key));
  } catch(e) {
    showToast('Delete failed', true);
  }
}

// ─── History ───────────────────────────────────────────────────
function renderHistory() {
  const container = document.getElementById('history-list');
  container.innerHTML = '';

  const entries = Object.entries(savedShifts)
    .map(([k, v]) => {
      const parts = k.split('::');
      return { date: parts[0], shift: parts[1], data: v, key: k };
    })
    .filter(e => e.date && e.shift)
    .sort((a, b) => {
      if (b.date !== a.date) return b.date.localeCompare(a.date);
      return a.shift === 'AM' ? -1 : 1;
    });

  if (entries.length === 0) {
    container.innerHTML = '<div class="history-empty">No saved shifts yet</div>';
    return;
  }

  entries.forEach(entry => {
    const barTotal    = (entry.data.bar    || []).reduce((s,e) => s+(parseFloat(e.amount)||0), 0);
    const runnerTotal = (entry.data.runner || []).reduce((s,e) => s+(parseFloat(e.amount)||0), 0);
    const busserTotal = (entry.data.busser || []).reduce((s,e) => s+(parseFloat(e.amount)||0), 0);

    const dateObj   = new Date(entry.date + 'T12:00:00');
    const dateLabel = dateObj.toLocaleDateString('en-US',
      { weekday:'short', month:'short', day:'numeric', year:'numeric' });

    const el = document.createElement('div');
    el.className = 'history-entry';
    el.innerHTML = `
      <div class="history-header">
        <span class="history-date-label">${dateLabel}
          <span class="history-shift-badge ${entry.shift==='AM'?'badge-am':'badge-pm'}">${entry.shift}</span>
        </span>
      </div>
      <div class="history-totals">
        <div class="history-cat">
          <div class="history-cat-name">Bar</div>
          <div class="history-cat-amount">${fmt(barTotal)}</div>
        </div>
        <div class="history-cat">
          <div class="history-cat-name">Runners</div>
          <div class="history-cat-amount">${fmt(runnerTotal)}</div>
        </div>
        <div class="history-cat">
          <div class="history-cat-name">Bussers</div>
          <div class="history-cat-amount">${fmt(busserTotal)}</div>
        </div>
      </div>
      <div class="history-delete">
        <button class="delete-btn">Delete</button>
      </div>`;

    el.querySelector('.delete-btn').addEventListener('click', () => deleteShift(entry.key));
    container.appendChild(el);
  });
}

// ─── Utils ─────────────────────────────────────────────────────
function fmt(val) {
  return new Intl.NumberFormat('en-US', { style:'currency', currency:'USD' }).format(val);
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isError ? 'error show' : 'show';
  setTimeout(() => { t.className = ''; }, 2800);
}

// ─── Go ────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
